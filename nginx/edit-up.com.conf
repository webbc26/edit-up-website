# ==============================================================================
# Nginx Configuration for edit-up.com (Edit Up AI Video & Photo Editor)
# Location: /etc/nginx/sites-available/edit-up.com
# Symlink:  sudo ln -sf /etc/nginx/sites-available/edit-up.com /etc/nginx/sites-enabled/
#
# NOTE: This configuration starts on HTTP (Port 80) so that:
#   1. `sudo nginx -t` passes immediately (no missing certificate errors).
#   2. You can run Certbot to automatically obtain SSL and configure HTTPS:
#      sudo certbot --nginx -d edit-up.com -d www.edit-up.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name edit-up.com www.edit-up.com;

    # Root Directory — Point to your repository path
    # Update this path if you clone to a different directory (e.g., /var/www/edit-up.com)
    root /home/nadim/braincraft/edit-up-html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Apple App Site Association (AASA) for Apple Universal Links
    # Critical: Must be served as application/json without .json in URL path
    # --------------------------------------------------------------------------
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location = /apple-app-site-association {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # --------------------------------------------------------------------------
    # 2. Video Templates Universal Link Routing: /video-templates/{id}
    # --------------------------------------------------------------------------
    location /video-templates/ {
        # Check if direct static file/folder exists, otherwise fall back to video-templates/index.html
        try_files $uri $uri/ /video-templates/index.html?$args;
    }

    # Legacy /templates/ redirect to /video-templates/
    location /templates/ {
        rewrite ^/templates/(.*)$ /video-templates/$1 permanent;
    }

    # Shortlink /v/{id} redirect to /video-templates/{id}
    location /v/ {
        rewrite ^/v/(.*)$ /video-templates/$1 permanent;
    }

    # --------------------------------------------------------------------------
    # 3. Static Assets Caching (CSS, JS, Images, Icons)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. Root & General Fallback Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
